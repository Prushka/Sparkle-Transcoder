services:
  frontend:
    image: ${FRONTEND_IMAGE:-sparkle-transcoder-frontend:local}
    build:
      context: ./web
    container_name: sparkle-transcoder-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # URL reachable from the frontend container, not from the browser.
      SPARKLE_API_BASE: "${SPARKLE_API_BASE:-http://host.docker.internal:1323/api}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
