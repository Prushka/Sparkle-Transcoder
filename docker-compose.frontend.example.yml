services:
  frontend:
    image: meinya/sparkle-manager-frontend:latest
    container_name: sparkle-manager-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # URL reachable from the frontend container, not from the browser.
      SPARKLE_API_BASE: "http://host.docker.internal:1323/api"
    extra_hosts:
      - "host.docker.internal:host-gateway"
